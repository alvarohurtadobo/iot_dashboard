name: iot_dashboard
description: "IoT Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  go_router: 17.0.1
  # BLoC
  flutter_bloc: 8.1.3
  equatable: 2.0.5
  # HTTP Client
  dio: 5.9.1
  # Storage
  shared_preferences: 2.2.2 
  retrofit: 4.9.2
  json_annotation: 4.10.0
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.11.0
  retrofit_generator: 10.2.1
  json_serializable: 6.12.0
  flutter_launcher_icons: 0.14.4
  freezed: ^2.4.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  linux:
    generate: true
    image_path: "assets/icons/icon.png"
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/icon.png"
